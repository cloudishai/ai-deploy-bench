# Static files only. Pages use no inline scripts or styles, so the CSP allows nothing but the site's own files.
# (Their JSON-LD is a data block, which browsers don't run, so the CSP doesn't apply to it.)

# Every page has a markdown version next to it (index.md), for agents. A request that accepts
# text/markdown gets it at the page's own URL; anything else gets the HTML. "-" is a file that never exists.
map $http_accept $markdown_index {
    default            "-";
    "~*text/markdown"  "index.md";
}

map $uri $cache_control {
    default                        "public, max-age=300";
    ~^/static/                     "public, max-age=31536000, immutable";  # URLs carry a content hash
    ~\.(jpg|png|svg|ico)$          "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;  # behind Cloudish's proxy; /runs -> /runs/ must not name port 8080
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/xml text/plain text/markdown;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain text/markdown;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;
    add_header Vary "Accept" always;  # a page's URL serves HTML or markdown

    location / {
        # .md isn't in nginx's MIME types; it's the only extension the site has that isn't.
        default_type text/markdown;
        try_files $uri/$markdown_index $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
