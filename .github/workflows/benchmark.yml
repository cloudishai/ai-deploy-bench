name: Benchmark

# Runs the benchmark matrix: one reusable-workflow call per cloud, each fanning out into one job
# (and one fresh Claude Code session) per model x app x trial. A final job collects every cell's
# result and opens a pull request adding it under results/ and refreshing the summary in README.md,
# so a person reviews each run before it lands on the default branch (cloud runs can fail for reasons
# only a person can judge, such as a missing payment method).
on:
  workflow_dispatch:
    inputs:
      clouds:
        description: Cloud ids, comma-separated, or "all" (see benchmark.yaml)
        default: all
      apps:
        description: App ids, comma-separated, or "all"
        default: all
      models:
        description: Model ids, comma-separated, or "all"
        default: all
      trials:
        description: Trials per cell
        default: "1"
      max_parallel:
        description: Cells per cloud running at once (empty uses benchmark.yaml)
        default: ""
      keep_deployments:
        description: Leave deployments running after verification (you clean them up)
        type: boolean
        default: false
      open_results_pr:
        description: Open a pull request with results/ and README.md (instead of committing to the branch)
        type: boolean
        default: true
      base_run:
        description: Full run to complete (e.g. 2026-10-14_13-1); only the cells chosen above rerun, the rest are copied from it
        default: ""
      smoke_test:
        description: Use a stub instead of Claude Code (no model spend) to check secrets and plumbing
        type: boolean
        default: false
  # Every run spends model and cloud credits; uncomment to run weekly with the defaults above.
  # schedule:
  #   - cron: "17 6 * * 1"

# Runs share the cloud accounts, so never overlap them (cleanup.yml uses the same group).
concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      clouds: ${{ steps.plan.outputs.clouds }}
      run_name: ${{ steps.meta.outputs.run_name }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - id: meta
        env:
          SMOKE: ${{ inputs.smoke_test }}
        run: |
          date=$(date -u +%Y-%m-%d)
          echo "date=$date" >> "$GITHUB_OUTPUT"
          suffix=""
          if [ "$SMOKE" = "true" ]; then suffix="-smoke"; fi
          echo "run_name=${date}_${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}${suffix}" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          CLOUDS: ${{ inputs.clouds || 'all' }}
          APPS: ${{ inputs.apps || 'all' }}
          MODELS: ${{ inputs.models || 'all' }}
          TRIALS: ${{ inputs.trials || '1' }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          BASE_RUN: ${{ inputs.base_run }}
          # Only for a read-only listing per planned cloud, so a dead token fails here, not in every cell.
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: >
          python -m bench plan --clouds "$CLOUDS" --apps "$APPS" --models "$MODELS" --trials "$TRIALS"
          ${MAX_PARALLEL:+--max-parallel "$MAX_PARALLEL"} ${BASE_RUN:+--base-run "$BASE_RUN"}
          --check-credentials --out plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: plan.json

  cloud:
    needs: plan
    name: ${{ matrix.cloud }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.clouds) }}
    uses: ./.github/workflows/cloud.yml
    with:
      cloud: ${{ matrix.cloud }}
      cells: ${{ toJSON(matrix.cells) }}
      max_parallel: ${{ matrix.max_parallel }}
      run_id: ${{ github.run_id }}-${{ github.run_attempt }}
      keep_deployments: ${{ inputs.keep_deployments || false }}
      smoke_test: ${{ inputs.smoke_test || false }}
    secrets: inherit

  # Runs when cells failed (they're reported), but not when the run was cancelled.
  collect:
    needs: [plan, cloud]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the results branch
      pull-requests: write   # open the results PR
    env:
      RUN_NAME: ${{ needs.plan.outputs.run_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: plan
      - uses: actions/download-artifact@v8
        continue-on-error: true  # no cell may have produced an artifact; they're then reported missing
        with:
          pattern: cell-*
          path: artifacts
      - name: Aggregate results
        id: aggregate
        env:
          DATE: ${{ needs.plan.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_RUN: ${{ inputs.base_run }}
        run: >
          python -m bench aggregate --artifacts artifacts --plan plan.json --results results --readme README.md
          --run-name "$RUN_NAME" --date "$DATE" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --run-url "$RUN_URL" ${BASE_RUN:+--base-run "$BASE_RUN"}
      - run: cat "results/runs/$RUN_NAME/summary.md" >> "$GITHUB_STEP_SUMMARY"
      # A pull request rather than a direct commit, so a person reviews each run before it lands on the
      # default branch. Cloud runs can fail for reasons only a person can judge (a missing payment
      # method, an expired trial), and those shouldn't quietly overwrite the published results.
      - name: Open results pull request
        if: ${{ !inputs.smoke_test && (inputs.open_results_pr || github.event_name == 'schedule') && steps.aggregate.outputs.commit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: results/${{ needs.plan.outputs.run_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add results README.md
          git commit --quiet -m "Benchmark results for run $RUN_NAME" || { echo "nothing to commit"; exit 0; }
          # The run name carries the run number and attempt, so distinct runs get distinct branches.
          # Force only covers re-pushing the same branch; the first push of a new branch is enough.
          git push --quiet origin "$BRANCH" || git push --quiet --force origin "$BRANCH"
          body="Automated results for run **$RUN_NAME** ([workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)).

          Review before merging: a run can include cells that failed for reasons only a person can judge, such as a missing payment method or an expired trial. The run summary is in the job summary and in \`results/runs/$RUN_NAME/summary.md\`."
          if ! gh pr create --base "$BASE" --head "$BRANCH" \
                --title "Benchmark results for run $RUN_NAME" --body "$body"; then
            echo "A pull request for $BRANCH already exists; its branch was updated."
          fi
          echo "::notice::Results are in pull request for branch $BRANCH (and attached to this run as artifacts)."
