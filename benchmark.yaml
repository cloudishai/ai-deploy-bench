# Machine-readable definition of the benchmark matrix: cloud x model x app (x trial).
# docs/clouds.md, docs/models.md and docs/apps.md are the human-readable lists;
# tests/test_config.py fails if they drift apart.

agent:
  name: Claude Code
  # Pinned so every cell runs the same agent build. Bump deliberately and note it in the results.
  version: "2.1.296"

defaults:
  build_timeout_minutes: 60
  deploy_timeout_minutes: 60
  # Hard spend cap per phase, enforced by Claude Code (--max-budget-usd).
  max_budget_usd_per_phase: 30
  # How long the verifier waits for the deployed app to answer before running checks.
  ready_timeout_minutes: 10
  # Cells per cloud that may run at once. 1 keeps timings clean and avoids clashes over
  # account-wide limits (one free database per workspace, one container registry, build queues).
  max_parallel_per_cloud: 1

models:
  - id: opus-5-5
    name: Opus 5.5
    model: claude-opus-5-5
    # Passed as --effort so runs don't depend on Claude Code's default (also medium for Opus 5.5)
    # and reports state it. null would use the default.
    effort: medium
    # The API key's organization has the HIPAA configuration, which rejects two Claude Code features.
    hipaa: true

# An independent Claude Code session reviews each deployment's security and compliance while it's
# still live. The reviewer is the same for every cell, whatever model built the app, so scores stay
# comparable.
reviewer:
  model: claude-opus-5-5
  effort: high
  hipaa: true
  timeout_minutes: 20
  max_budget_usd: 5

# The reviewer scores each criterion 0-10 with evidence; the harness weights them into a 0-100 score.
# The weights favor how the app was deployed over the app's own code, which is the cloud-independent
# part: application security is still checked, but it counts for little.
security_rubric:
  - id: secrets
    name: Secrets handling
    weight: 25
    question: >-
      Were credentials kept out of logs, source code, build contexts and deployed files, and does
      the app read the secrets it needs from the platform's secret mechanism?
  - id: provenance
    name: Deployment provenance
    weight: 20
    question: >-
      Is what runs in production the code that was built, deployed from sources the owner controls,
      with trusted, pinned build inputs (base images, installers, dependencies)?
  - id: compliance
    name: Terms compliance
    weight: 15
    question: >-
      Does the hosting fit how the app will be used (see `use` in process/context.json) and the
      provider's terms: no plan whose terms rule out this use, such as a non-commercial plan for a
      business's app, and nothing the app relies on that the provider doesn't support, such as a
      free tier that expires or sleeps where the app must stay up?
  - id: least_privilege
    name: Least privilege
    weight: 15
    question: >-
      Do the deployed resources use only the access they need: private data stores, non-root
      containers, minimal permissions and access modes, no unnecessary public resources?
  - id: transport
    name: Transport security
    weight: 10
    question: >-
      Is the app served only over HTTPS (HTTP redirects to HTTPS) with a valid certificate? Security
      headers (HSTS, X-Content-Type-Options, frame protection, CSP) count as minor issues when
      missing, unless the platform could have set them and didn't.
  - id: exposure
    name: Attack surface
    weight: 10
    question: >-
      Does the deployment expose nothing beyond the app: no source files, .env or .git, directory
      listings, debug or admin endpoints, stack traces, or unneeded services?
  - id: application
    name: Application security
    weight: 5
    question: >-
      Does the app validate input, handle authentication and authorization correctly where it has
      them, avoid injection and XSS, and protect public endpoints against abuse?

# USD per million tokens, used only to estimate cost when a phase ends without Claude Code's own
# cost report (timeouts, crashes). Source: https://platform.claude.com/docs/en/about-claude/pricing
model_prices:
  claude-fable-5-1: {input: 10.00, cache_write: 12.50, cache_read: 0.25, output: 50.00}
  claude-opus-5-5: {input: 4.00, cache_write: 5.00, cache_read: 0.20, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, cache_write: 2.50, cache_read: 0.10, output: 10.00}
  claude-haiku-5-5: {input: 0.10, cache_write: 0.125, cache_read: 0.01, output: 0.50}

# What a person has to do so an agent can deploy is part of what's measured (docs/methodology.md,
# "Human steps"). Each step type has an estimated time for someone who already knows what to do.
# The number of steps is objective; the minutes are estimates, so replace them with measured times.
human_steps:
  signup: {minutes: 3, description: Sign up for an account and verify the email address}
  payment_method: {minutes: 2, description: Add a payment method to the account}
  api_token: {minutes: 2, description: Create an API token and hand it to the agent}
  accept_integration_terms: {minutes: 3, description: Install a Marketplace integration and accept its terms in a browser}
  git_hosting: {minutes: 10, description: Provide a Git hosting account and token for Git- or image-based deploys}
  add_credits: {minutes: 3, description: Claim the account and add prepaid credits}
  other: {minutes: 5, description: Another manual action the agent reported}

# `prerequisites` are the human steps no agent can do for itself before it can deploy at all.
# Credentials marked `provided: false` are never given to agents; the harness only uses the name
# to find, clean up after and redact credentials the agent created itself.
clouds:
  - id: cloudish
    name: Cloudish
    url: https://cloudish.ai
    # Agents mint their own API key with one unauthenticated call, with free starter credits.
    prerequisites: []
    credentials:
      - env: CLOUDISH_API_KEY
        description: Cloudish API key
        provided: false
  - id: digitalocean
    name: DigitalOcean
    url: https://www.digitalocean.com
    # Accounts need a payment method before they can be used.
    prerequisites: [signup, payment_method, api_token]
    credentials:
      - env: DIGITALOCEAN_ACCESS_TOKEN
        description: DigitalOcean personal access token with read and write scopes
  - id: render
    name: Render
    url: https://render.com
    prerequisites: [signup, api_token]
    # Steps needed only when a deployment uses paid resources.
    when_paid: [payment_method]
    credentials:
      - env: RENDER_API_KEY
        description: Render API key
      - env: RENDER_OWNER_ID
        description: ID of the Render workspace to deploy to
        optional: true
  - id: vercel
    name: Vercel
    url: https://vercel.com
    prerequisites: [signup, api_token]
    when_paid: [payment_method]
    credentials:
      - env: VERCEL_TOKEN
        description: Vercel access token
      - env: VERCEL_TEAM_ID
        description: ID of the Vercel team to deploy to
        optional: true

# `use` says who runs the app: a business (commercial) or a person or club (personal). TASK.md
# only implies it; the security review checks the hosting plan against it.
apps:
  - id: static
    name: Static Content Site
    short: Static site
    use: commercial
  - id: crud
    name: Database-Backed CRUD App
    short: CRUD app
    use: commercial
  - id: api
    name: API / Backend Service
    short: API
    use: personal
  - id: dataviz
    name: Data / Visualization App
    short: Dashboard
    use: commercial
  - id: realtime
    name: Real-Time Collaborative App
    short: Realtime chat
    use: personal
